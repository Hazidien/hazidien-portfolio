<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeoAI Remote Sensing WebGIS</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.0/dist/leaflet-geoman.css"><link rel="stylesheet" href="css/style.css"></head>
<body><aside class="sidebar"><div class="brand"><span>HRU</span><div>GeoAI<br><small>Remote Sensing</small></div></div><p class="eyebrow">SATELLITE ANALYSIS</p><h1>GeoAI Analysis</h1><label>Module<select id="module"><option>Air Pollution</option></select></label><label>Variable<select id="variable"><option value="CO">CO</option><option disabled>NO₂ — coming soon</option><option disabled>SO₂ — coming soon</option></select></label><div class="grid2"><label>Start date<input id="start" type="date" value="2026-01-01"></label><label>End date<input id="end" type="date" value="2026-03-31"></label></div><label>Aggregation<select id="aggregation"><option value="mean">Mean</option><option value="median">Median</option><option value="min">Minimum</option><option value="max">Maximum</option></select></label><button id="run" class="run">RUN ANALYSIS</button><button id="clear" class="secondary">CLEAR AOI</button><div id="status" class="status">Draw a polygon or rectangle on the map.</div><section id="results" class="results hidden"><div class="result-head"><span>RESULT</span><strong id="resultVar">CO</strong></div><div class="metric"><small>Selected value</small><strong id="value">—</strong><span id="unit">mol/m²</span></div><div class="stats"><div><small>Mean</small><b id="mean">—</b></div><div><small>Minimum</small><b id="min">—</b></div><div><small>Maximum</small><b id="max">—</b></div><div><small>Images</small><b id="images">—</b></div></div><div class="date-result"><small>Date range</small><b id="dates">—</b></div><p id="note"></p></section></aside><main id="map"></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.0/dist/leaflet-geoman.min.js"></script><script src="js/map.js"></script><script src="js/api.js"></script><script src="js/app.js"></script></body></html>
